repos:
   - repo: https://github.com/astral-sh/ruff-pre-commit
     rev: v0.15.6
     hooks:
        - id: ruff-check  # Linter
          args: [--fix]  # Ensure fixes are applied
        - id: ruff-format  # Formatter
   - repo: https://github.com/rubik/xenon
     rev: v0.9.0
     hooks:
        - id: xenon
          args: ['--max-absolute=B', '--max-modules=B', '--max-average=A']
   - repo: local
     hooks:
        - id: mypy-homework-lab01
          name: mypy (homework lab01)
          entry: uv run --project homework/lab01 --locked mypy
          args: [--config-file=homework/lab01/pyproject.toml]
          language: system
          files: ^homework/lab01/.*\.py$
          types: [python]
